name: Build & Package Android APKs

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    name: Build Next.js & Verify APKs
    if: github.event_name == 'workflow_dispatch' || (github.actor != 'github-actions[bot]' && !startsWith(github.event.head_commit.message, 'chore: update built APKs') && !startsWith(github.event.head_commit.message, 'Update built APKs'))
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --no-audit --prefer-offline

      - name: Build Next.js Applet
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      - name: Verify APK Binaries
        run: |
          echo "Verifying APK files in public/..."
          test -f public/cbebirr-plus.apk || { echo "Missing cbebirr-plus.apk"; exit 1; }
          test -f public/CBEMessages.apk || { echo "Missing CBEMessages.apk"; exit 1; }
          test -f public/apk-version.json || { echo "Missing apk-version.json"; exit 1; }
          STAMP="$(unzip -p public/cbebirr-plus.apk assets/web/.build-stamp 2>/dev/null || true)"
          echo "cbebirr-plus.apk .build-stamp: ${STAMP}"
          test -n "${STAMP}" || { echo "cbebirr-plus.apk missing assets/web/.build-stamp"; exit 1; }
          cat public/apk-version.json
          ls -lh public/*.apk

      - name: Commit & Push Updated APKs to Repo
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/cbebirr-plus.apk public/CBEMessages.apk public/SamsungMessages.apk public/apk-version.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update built APKs (run #${{ github.run_number }})"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          else
            echo "No APK changes to commit."
          fi

      - name: Upload APKs as Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CBEBirr-and-SamsungMessages-APKs
          path: |
            public/cbebirr-plus.apk
            public/SamsungMessages.apk
            public/CBEMessages.apk
          retention-days: 30
