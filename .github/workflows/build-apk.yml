name: Build & Package Android APKs

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify:
    name: Build Next.js & Verify APKs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --no-audit --prefer-offline

      - name: Build Next.js Applet
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      - name: Verify APK Binaries
        run: |
          echo "Verifying APK files in public/..."
          test -f public/cbebirr-plus.apk || { echo "Missing cbebirr-plus.apk"; exit 1; }
          test -f public/CBEMessages.apk || { echo "Missing CBEMessages.apk"; exit 1; }
          ls -la public/*.apk

      - name: Commit & Push Updated APKs to Repo
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/cbebirr-plus.apk public/CBEMessages.apk public/SamsungMessages.apk
          if ! git diff --cached --quiet; then
            git commit -m "Update built APKs [skip ci]"
            git push
          else
            echo "No APK changes to commit."
          fi

      - name: Upload APKs as Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CBEBirr-and-SamsungMessages-APKs
          path: |
            public/cbebirr-plus.apk
            public/SamsungMessages.apk
            public/CBEMessages.apk
          retention-days: 30
